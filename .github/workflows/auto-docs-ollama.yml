name: Auto Docs Update (Ollama)

on:
  push:
    branches: [main]
    paths:
      - src/**
      - scripts/**
      - contracts/**
      - data/**
      - .github/workflows/**
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: auto-docs-ollama-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update-docs:
    # Optional: protect this environment in repo settings with required reviewers.
    environment: docs-automation
    if: github.event_name != 'push' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repo
        # Pin reviewed SHAs and update only via approved maintenance PRs.
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        # Pin reviewed SHAs and update only via approved maintenance PRs.
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20

      - name: Install Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh

      - name: Start Ollama daemon
        run: |
          nohup ollama serve >/tmp/ollama.log 2>&1 &
          for i in {1..30}; do
            if ollama list >/dev/null 2>&1; then
              echo "Ollama is ready"
              exit 0
            fi
            sleep 2
          done
          echo "Ollama failed to start"
          cat /tmp/ollama.log || true
          exit 1

      - name: Pull model
        run: ollama pull "${OLLAMA_MODEL}"
        env:
          OLLAMA_MODEL: llama3

      - name: Run doc updater
        run: node scripts/ollama-docs.js
        env:
          OLLAMA_MODEL: llama3
          OLLAMA_DIFF_COMMITS: "3"
          DOCS_STRICT_MODE: "true"
          DOCS_MIN_CONFIDENCE: "0.70"

      - name: Create PR
        # Pin reviewed SHAs and update only via approved maintenance PRs.
        uses: peter-evans/create-pull-request@c5a7806660adbe173f04e3e038b0ccdcd758773c # v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          base: main
          branch: auto/docs-ollama
          branch-suffix: short-commit-hash
          delete-branch: true
          author: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
          committer: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
          commit-message: "docs: auto update via Ollama"
          title: "docs: auto docs update (Ollama)"
          body: |
            Automated documentation update based on recent repository changes.

            Generated by the Ollama docs workflow.
          add-paths: |
            README.md
            docs/**/*.md
          labels: |
            documentation
            automation