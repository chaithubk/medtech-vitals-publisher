name: Contract Drift Check

on:
  repository_dispatch:
    types: [contract-release-published]
  schedule:
    # Fallback check only (primary mechanism is release-driven dispatch)
    - cron: "0 8 * * 1"
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  resolve:
    name: Resolve target contract tag
    runs-on: ubuntu-latest
    outputs:
      drift: ${{ steps.compare.outputs.drift }}
      pinned: ${{ steps.pinned.outputs.version }}
      latest: ${{ steps.latest.outputs.latest }}
      target: ${{ steps.target.outputs.tag }}

    steps:
      - uses: actions/checkout@v4

      - name: Read pinned contract version
        id: pinned
        run: |
          VERSION=$(python - <<'PY'
          import json
          from pathlib import Path

          p = Path("contracts/vitals/contract-pin.json")
          if not p.exists():
            raise SystemExit("Missing contracts/vitals/contract-pin.json")
          print(json.loads(p.read_text(encoding="utf-8")).get("tag", ""))
          PY
          )
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Pinned contract version: $VERSION"

      - name: Fetch latest tag from medtech-telemetry-contract
        id: latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          LATEST=$(gh api repos/chaithubk/medtech-telemetry-contract/tags \
            --jq '.[0].name' 2>/dev/null || echo "")
          if [ -z "$LATEST" ]; then
            echo "⚠️  Could not fetch tags from chaithubk/medtech-telemetry-contract."
            echo "   Check that the repository exists and is accessible."
            exit 1
          fi
          echo "latest=$LATEST" >> "$GITHUB_OUTPUT"
          echo "Latest contract tag:  $LATEST"

      - name: Resolve target tag (dispatch first, otherwise latest)
        id: target
        env:
          DISPATCH_TAG: ${{ github.event.client_payload.tag }}
          LATEST: ${{ steps.latest.outputs.latest }}
        run: |
          if [ -n "$DISPATCH_TAG" ]; then
            echo "tag=$DISPATCH_TAG" >> "$GITHUB_OUTPUT"
            echo "Using release-dispatch target tag: $DISPATCH_TAG"
          else
            echo "tag=$LATEST" >> "$GITHUB_OUTPUT"
            echo "Using latest tag from API: $LATEST"
          fi

      - name: Compare versions
        id: compare
        env:
          PINNED: ${{ steps.pinned.outputs.version }}
          TARGET: ${{ steps.target.outputs.tag }}
        run: |
          echo "Pinned : $PINNED"
          echo "Target : $TARGET"
          if [ "$PINNED" = "$TARGET" ]; then
            echo "drift=false" >> "$GITHUB_OUTPUT"
            echo "✅ Contract is up to date (pinned == target: $PINNED)."
          else
            echo "drift=true" >> "$GITHUB_OUTPUT"
            echo ""
            echo "⚠️  Contract drift detected."
            echo ""
            echo "   Current pin : $PINNED"
            echo "   Target tag  : $TARGET"
            echo ""
            echo "An automated vendoring PR will be created for tag $TARGET."
          fi

  auto-vendor:
    name: Auto-create contract update PR
    needs: resolve
    if: needs.resolve.outputs.drift == 'true'
    uses: ./.github/workflows/vendor-telemetry-contract.yml
    with:
      tag: ${{ needs.resolve.outputs.target }}
    secrets: inherit
