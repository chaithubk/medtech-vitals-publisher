name: Contract Drift Check

on:
  schedule:
    # Run daily at 08:00 UTC
    - cron: "0 8 * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  drift-check:
    name: Check for new telemetry contract tag
    runs-on: ubuntu-latest
    outputs:
      drift: ${{ steps.compare.outputs.drift }}
      pinned: ${{ steps.pinned.outputs.version }}
      latest: ${{ steps.latest.outputs.latest }}

    steps:
      - uses: actions/checkout@v4

      - name: Read pinned contract version
        id: pinned
        run: |
          VERSION=$(cat contracts/VITALS_CONTRACT_VERSION.txt | tr -d '[:space:]')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Pinned contract version: $VERSION"

      - name: Fetch latest tag from medtech-telemetry-contract
        id: latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          LATEST=$(gh api repos/chaithubk/medtech-telemetry-contract/tags \
            --jq '.[0].name' 2>/dev/null || echo "")
          if [ -z "$LATEST" ]; then
            echo "⚠️  Could not fetch tags from chaithubk/medtech-telemetry-contract."
            echo "   Check that the repository exists and is accessible."
            exit 1
          fi
          echo "latest=$LATEST" >> "$GITHUB_OUTPUT"
          echo "Latest contract tag:  $LATEST"

      - name: Compare versions
        id: compare
        env:
          PINNED: ${{ steps.pinned.outputs.version }}
          LATEST: ${{ steps.latest.outputs.latest }}
        run: |
          echo "Pinned : $PINNED"
          echo "Latest : $LATEST"
          if [ "$PINNED" = "$LATEST" ]; then
            echo "drift=false" >> "$GITHUB_OUTPUT"
            echo "✅ Contract is up to date (pinned == latest: $PINNED)."
          else
            echo "drift=true" >> "$GITHUB_OUTPUT"
            echo ""
            echo "⚠️  Contract drift detected."
            echo ""
            echo "   Current pin : $PINNED"
            echo "   Latest tag  : $LATEST"
            echo ""
            echo "An automated vendoring PR will be created for tag $LATEST."
          fi

  auto-vendor:
    name: Auto-create contract update PR
    needs: drift-check
    if: needs.drift-check.outputs.drift == 'true'
    uses: ./.github/workflows/vendor-telemetry-contract.yml
    with:
      tag: ${{ needs.drift-check.outputs.latest }}
    secrets: inherit
