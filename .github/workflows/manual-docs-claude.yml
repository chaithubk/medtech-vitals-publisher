name: Manual Docs Review (Claude)

on:
  workflow_dispatch:
    inputs:
      model:
        description: Claude model ID
        required: false
        default: claude-3-haiku-20240307
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: manual-docs-claude-${{ github.ref }}
  cancel-in-progress: false

jobs:
  review-docs:
    # Optional: protect this environment in repo settings with required reviewers.
    environment: docs-automation
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repo
        # Pin reviewed SHAs and update only via approved maintenance PRs.
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Python
        # Pin reviewed SHAs and update only via approved maintenance PRs.
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install anthropic==0.105.2

      - name: Verify Claude API key
        run: |
          if [ -z "${ANTHROPIC_API_KEY}" ]; then
            echo "Missing ANTHROPIC_API_KEY secret."
            exit 1
          fi
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Run Claude script
        run: python scripts/claude_docs.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_MODEL: ${{ github.event.inputs.model }}
          CLAUDE_DIFF_COMMITS: "5"
          DOCS_STRICT_MODE: "true"
          DOCS_MIN_CONFIDENCE: "0.70"

      - name: Create PR
        # Pin reviewed SHAs and update only via approved maintenance PRs.
        uses: peter-evans/create-pull-request@c5a7806660adbe173f04e3e038b0ccdcd758773c # v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          base: main
          branch: manual/docs-claude
          branch-suffix: short-commit-hash
          delete-branch: true
          author: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
          committer: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
          commit-message: "docs: deep review via Claude"
          title: "docs: deep docs review (Claude)"
          body: |
            High-quality documentation revision generated from recent repository changes.

            Generated by the manual Claude docs workflow.
          add-paths: |
            README.md
            docs/**/*.md
          labels: |
            documentation
            automation