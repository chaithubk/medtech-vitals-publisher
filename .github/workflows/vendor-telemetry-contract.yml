name: Vendor Telemetry Contract

on:
  workflow_dispatch:
    inputs:
      tag:
        description: >
          Contract repo tag to vendor (e.g. v2.1.0).
          Leave blank to use the latest published tag automatically.
        required: false
        default: ""
  workflow_call:
    inputs:
      tag:
        description: Contract repo tag to vendor.
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  vendor:
    name: Vendor schema and open PR
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Resolve target tag
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.CD_PAT }}
          INPUT_TAG: ${{ inputs.tag || github.event.inputs.tag }}
        run: |
          if [ -n "$INPUT_TAG" ]; then
            echo "tag=$INPUT_TAG" >> "$GITHUB_OUTPUT"
            echo "Using requested tag: $INPUT_TAG"
          else
            LATEST=$(gh api repos/chaithubk/medtech-telemetry-contract/releases/latest \
              --jq '.tag_name' 2>/dev/null || echo "")
            if [ -z "$LATEST" ] || [ "$LATEST" = "null" ]; then
              LATEST=$(gh api repos/chaithubk/medtech-telemetry-contract/tags \
                --jq '.[0].name' 2>/dev/null || echo "")
            fi
            if [ -z "$LATEST" ]; then
              echo "❌ Could not resolve latest tag from chaithubk/medtech-telemetry-contract."
              exit 1
            fi
            echo "tag=$LATEST" >> "$GITHUB_OUTPUT"
            echo "Resolved latest tag: $LATEST"
          fi

      - name: Run vendoring script
        run: |
          python scripts/vendor_telemetry_contract.py --tag "${{ steps.resolve.outputs.tag }}"

      - name: Bump CD revision
        run: |
          if git diff --quiet -- contracts/vitals/current.json contracts/VITALS_CONTRACT_VERSION.txt; then
            echo "No contract file changes detected; skipping CD revision bump."
            exit 0
          fi

          VERSION_FILE="src/__init__.py"
          CURRENT=$(sed -nE 's/^__version__ = "([0-9]+\.[0-9]+\.[0-9]+)"/\1/p' "$VERSION_FILE")
          if [ -z "$CURRENT" ]; then
            echo "❌ Could not parse __version__ from $VERSION_FILE"
            exit 1
          fi

          IFS='.' read -r major minor patch <<< "$CURRENT"
          NEXT="${major}.${minor}.$((patch + 1))"

          sed -i -E "s/^__version__ = \"[0-9]+\.[0-9]+\.[0-9]+\"/__version__ = \"${NEXT}\"/" "$VERSION_FILE"
          echo "Bumped CD revision: $CURRENT -> $NEXT"

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No changes — schema is already up to date."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Changes detected:"
            git diff --stat
          fi

      - name: Create branch, commit, and open PR
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.CD_PAT }}
          TAG: ${{ steps.resolve.outputs.tag }}
        run: |
          BRANCH="chore/vendor-telemetry-contract-${TAG}"
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git checkout -B "$BRANCH"
          git add contracts/vitals contracts/VITALS_CONTRACT_VERSION.txt src/__init__.py
          git commit -m "chore: vendor telemetry contract ${TAG}

          Vendored contracts/vitals/current.json from:
          chaithubk/medtech-telemetry-contract@${TAG}

          Updated contracts/VITALS_CONTRACT_VERSION.txt to ${TAG}.
          Bumped CD revision in src/__init__.py."

          git push --force-with-lease origin "$BRANCH"

          PR_NUMBER=$(gh pr list \
            --head "$BRANCH" \
            --base main \
            --state open \
            --json number \
            --jq '.[0].number')

          PR_BODY="## Automated contract update

          This PR vendors the MedTech telemetry contract schema at tag **\`${TAG}\`** from
          [chaithubk/medtech-telemetry-contract](https://github.com/chaithubk/medtech-telemetry-contract).

          ### Changes
          - \`contracts/vitals/current.json\` — updated to \`${TAG}\`
          - \`contracts/VITALS_CONTRACT_VERSION.txt\` — pinned to \`${TAG}\`
          - \`src/__init__.py\` — CD revision patch bump

          ### Checklist
          - [ ] Review schema diff below for breaking changes
          - [ ] Confirm CI (contract schema validation test) passes
          - [ ] Merge when green

          _Generated automatically by the **Vendor Telemetry Contract** workflow._"

          if [ -n "$PR_NUMBER" ] && [ "$PR_NUMBER" != "null" ]; then
            echo "PR #$PR_NUMBER already exists for $BRANCH; updating title/body."
            gh pr edit "$PR_NUMBER" \
              --title "chore: vendor telemetry contract ${TAG}" \
              --body "$PR_BODY"
          else
            gh pr create \
              --title "chore: vendor telemetry contract ${TAG}" \
              --body "$PR_BODY" \
              --base main \
              --head "$BRANCH"
          fi

      - name: No-op summary
        if: steps.changes.outputs.changed == 'false'
        run: echo "✅ Contract already at ${{ steps.resolve.outputs.tag }} — no PR needed."
