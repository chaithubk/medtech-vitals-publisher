name: Vendor Telemetry Contract

on:
  repository_dispatch:
    types: [contract-release-published]
  workflow_dispatch:
    inputs:
      tag:
        description: >
          Contract repo tag to vendor (e.g. v2.1.0).
          Leave blank to use the latest published tag automatically.
        required: false
        default: ""
  workflow_call:
    inputs:
      tag:
        description: Contract repo tag to vendor.
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  vendor:
    name: Vendor schema and open PR
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Resolve target tag
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.CD_PAT }}
          INPUT_TAG: ${{ inputs.tag || github.event.inputs.tag || github.event.client_payload.tag }}
        run: |
          if [ -n "$INPUT_TAG" ]; then
            echo "tag=$INPUT_TAG" >> "$GITHUB_OUTPUT"
            echo "Using requested tag: $INPUT_TAG"
          else
            LATEST=$(gh api repos/chaithubk/medtech-telemetry-contract/releases/latest \
              --jq '.tag_name' 2>/dev/null || echo "")
            if [ -z "$LATEST" ] || [ "$LATEST" = "null" ]; then
              LATEST=$(gh api repos/chaithubk/medtech-telemetry-contract/tags \
                --jq '.[0].name' 2>/dev/null || echo "")
            fi
            if [ -z "$LATEST" ]; then
              echo "❌ Could not resolve latest tag from chaithubk/medtech-telemetry-contract."
              exit 1
            fi
            echo "tag=$LATEST" >> "$GITHUB_OUTPUT"
            echo "Resolved latest tag: $LATEST"
          fi

      - name: Run vendoring script
        run: |
          python scripts/vendor_telemetry_contract.py \
            --tag "${{ steps.resolve.outputs.tag }}" \
            --summary-file /tmp/vendor-pr-summary.md

      - name: Read compatibility metadata
        id: compat
        run: |
          export GITHUB_OUTPUT_PATH="$GITHUB_OUTPUT"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          meta = json.loads(Path("contracts/vitals/contract-pin.json").read_text(encoding="utf-8"))
          compat = meta.get("compatibility", {})
          with open(Path(os.environ["GITHUB_OUTPUT_PATH"]), "a", encoding="utf-8") as out:
              out.write(f"classification={compat.get('classification', 'unknown')}\\n")
              out.write(f"breaking={str(bool(compat.get('breaking', False))).lower()}\\n")
              out.write(f"tag={meta.get('tag', '')}\\n")
          PY

      - name: Set package version to contract tag
        run: |
          if git diff --quiet -- contracts/vitals/vitals.schema.json contracts/vitals/contract-pin.json; then
            echo "No contract file changes detected; skipping CD revision bump."
            exit 0
          fi

          VERSION_FILE="src/__init__.py"
          RAW_TAG="${{ steps.resolve.outputs.tag }}"
          # Remove leading 'v' if present (robust for v2.1.0 or 2.1.0)
          if [[ "$RAW_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            NEW_VERSION="${RAW_TAG:1}"
          else
            NEW_VERSION="$RAW_TAG"
          fi
          sed -i -E "s/^__version__ = \".*\"/__version__ = \"${NEW_VERSION}\"/" "$VERSION_FILE"
          echo "Set __version__ to $NEW_VERSION"

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No changes — schema is already up to date."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Changes detected:"
            git diff --stat
          fi

      - name: Create branch, commit, and open PR
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.CD_PAT }}
          TAG: ${{ steps.compat.outputs.tag }}
          CLASSIFICATION: ${{ steps.compat.outputs.classification }}
          BREAKING: ${{ steps.compat.outputs.breaking }}
        run: |
          BRANCH="chore/vendor-telemetry-contract-${TAG}"
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git checkout -B "$BRANCH"
          git add contracts/vitals src/__init__.py
          git commit -m "chore: vendor telemetry contract ${TAG}

          Vendored contracts/vitals/vitals.schema.json from:
          chaithubk/medtech-telemetry-contract@${TAG}

          Updated contracts/vitals/contract-pin.json to ${TAG}.
          Bumped CD revision in src/__init__.py."

          git push --force-with-lease origin "$BRANCH"

          PR_NUMBER=$(gh pr list \
            --head "$BRANCH" \
            --base main \
            --state open \
            --json number \
            --jq '.[0].number')

          SUMMARY_FILE="/tmp/vendor-pr-summary.md"
          if [ -f "$SUMMARY_FILE" ]; then
            SUMMARY_CONTENT=$(cat "$SUMMARY_FILE")
          else
            SUMMARY_CONTENT="(No summary generated.)"
          fi

          PR_BODY="## Automated contract update

          This PR vendors the MedTech telemetry contract from
          [chaithubk/medtech-telemetry-contract](https://github.com/chaithubk/medtech-telemetry-contract).

          ${SUMMARY_CONTENT}

          ## Review Checklist

          - [ ] Verify schema diff summary and compatibility class
          - [ ] Confirm whether app code changes are needed
          - [ ] Confirm CI contract and integration tests pass
          - [ ] For breaking updates, complete migration checklist before merge

          _Generated automatically by the **Vendor Telemetry Contract** workflow._"

          if [ -n "$PR_NUMBER" ] && [ "$PR_NUMBER" != "null" ]; then
            echo "PR #$PR_NUMBER already exists for $BRANCH; updating title/body."
            gh pr edit "$PR_NUMBER" \
              --title "chore: vendor telemetry contract ${TAG}" \
              --body "$PR_BODY"
            gh pr edit "$PR_NUMBER" --add-label "contract-update" --add-label "compat:${CLASSIFICATION}" || true
          else
            gh pr create \
              --title "chore: vendor telemetry contract ${TAG}" \
              --body "$PR_BODY" \
              --base main \
              --head "$BRANCH"
            CREATED_PR_NUMBER=$(gh pr list \
              --head "$BRANCH" \
              --base main \
              --state open \
              --json number \
              --jq '.[0].number')
            gh pr edit "$CREATED_PR_NUMBER" --add-label "contract-update" --add-label "compat:${CLASSIFICATION}" || true
          fi

      - name: No-op summary
        if: steps.changes.outputs.changed == 'false'
        run: echo "✅ Contract already at ${{ steps.resolve.outputs.tag }} — no PR needed."
